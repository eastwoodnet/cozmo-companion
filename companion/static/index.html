<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozmo Companion</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">🤖</span>
    <h1>Cozmo Companion</h1>
    <span class="version" id="version"></span>
  </div>
  <div class="topbar-right">
    <div class="status-pill" id="conn-pill">
      <span class="dot" id="conn-dot"></span>
      <span id="conn-text">Offline</span>
    </div>
    <div class="status-pill" id="battery-pill" title="Batería">🔋 <span id="battery">—</span></div>
    <button class="btn btn-primary" id="btn-connect">Conectar</button>
    <button class="btn btn-ghost" id="btn-lang">EN</button>
  </div>
</header>

<main class="grid">

  <!-- CÁMARA -->
  <section class="card camera-card">
    <div class="card-header">
      <h2 data-i18n="camera">Cámara</h2>
      <div class="row">
        <button class="btn btn-small" id="btn-camera" disabled data-i18n="cam_on">Activar</button>
        <button class="btn btn-small" id="btn-photo" disabled>📸</button>
      </div>
    </div>
    <div class="camera-box">
      <img id="cam" alt="Cozmo camera" style="display:none">
      <div class="cam-placeholder" id="cam-placeholder">📷</div>
    </div>
  </section>

  <!-- MOVIMIENTO -->
  <section class="card">
    <div class="card-header"><h2 data-i18n="movement">Movimiento</h2></div>
    <div class="dpad-wrap">
      <div class="dpad">
        <button class="dpad-btn up"    data-drive="0,100,100" title="W / ↑">▲</button>
        <button class="dpad-btn left"  data-drive="1,-100,100" title="A / ←">◀</button>
        <button class="dpad-btn stop"  id="btn-stop" title="S">■</button>
        <button class="dpad-btn right" data-drive="1,100,-100" title="D / →">▶</button>
        <button class="dpad-btn down"  data-drive="0,-100,-100" title="S / ↓">▼</button>
      </div>
      <p class="hint" data-i18n="drive_hint">Mantén pulsado o usa WASD / flechas</p>
    </div>
    <div class="sliders">
      <label>💪 <span data-i18n="lift">Brazo</span>
        <input type="range" id="slider-lift" min="0" max="100" value="50" disabled>
      </label>
      <label>🗿 <span data-i18n="head">Cabeza</span>
        <input type="range" id="slider-head" min="0" max="100" value="50" disabled>
      </label>
    </div>
    <div class="row wrap">
      <button class="btn" id="btn-dance" disabled>🕺 <span data-i18n="dance">Bailar</span></button>
      <button class="btn" id="btn-look" disabled>👀 <span data-i18n="look">Explorar</span></button>
    </div>
    <div class="lights">
      <span data-i18n="lights">Luces</span>:
      <div class="swatches" id="swatches"></div>
      <input type="color" id="color-picker" value="#00ff00" title="Color personalizado" disabled>
    </div>
  </section>

  <!-- CHAT / VOZ -->
  <section class="card chat-card">
    <div class="card-header">
      <h2 data-i18n="chat">Conversación</h2>
      <select id="personality" class="select" title="Personalidad"></select>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" data-i18n-ph="chat_ph" placeholder="Escríbele algo a Cozmo...">
      <button class="btn btn-icon" id="btn-mic" style="display:none" title="Voz">🎤</button>
      <button class="btn btn-primary" id="btn-chat-send">➤</button>
    </div>
    <div class="stt-bar" id="stt-bar" style="display:none">
      <span class="pulse"></span><span id="stt-partial">...</span>
    </div>
    <div class="chat-input-row">
      <input type="text" id="cmd-input" data-i18n-ph="cmd_ph" placeholder="Comando: «cozmo avanza 2», «baila»...">
      <button class="btn" id="btn-cmd-send">⌨️</button>
    </div>
  </section>

  <!-- EMOCIONES -->
  <section class="card">
    <div class="card-header"><h2 data-i18n="emotions">Emociones</h2></div>
    <div class="emotion-display">
      <span class="emotion-emoji" id="emotion-emoji">🤔</span>
      <div>
        <div class="emotion-name" id="emotion-name">curious</div>
        <div class="boredom"><div class="boredom-fill" id="boredom-fill"></div></div>
      </div>
    </div>
    <div class="emotion-buttons" id="emotion-buttons"></div>
  </section>

  <!-- LOG -->
  <section class="card log-card">
    <div class="card-header"><h2>Log</h2><button class="btn btn-small btn-ghost" id="btn-clear-log">✕</button></div>
    <div class="log" id="log"></div>
  </section>

</main>

<script src="/static/app.js"></script>
</body>
</html>
